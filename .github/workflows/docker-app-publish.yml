name: Docker App Publish

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      frontend_branch:
        required: false
        type: string
        default: "main"

env:
  IMAGE_NAME: wisemapping/wisemapping

jobs:
  # The app image compiles the backend with Maven and the frontend with
  # webpack inside the build. Building arm64 under QEMU emulation is far too
  # slow for the webpack stage, so each architecture is built natively on its
  # own runner and the two are stitched into one manifest list by the merge job.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: jar-artifact
          path: wise-api/target/

      - name: Compute platform slug
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_SLUG=${PLATFORM//\//-}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Pushed by digest only: the tag is applied once, by the merge job, so
      # that it never points at a single-architecture image.
      - name: Build and push image by digest
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --build-arg FRONTEND_BRANCH=${{ inputs.frontend_branch }} \
            --build-arg CACHEBUST=${{ github.run_id }} \
            --metadata-file /tmp/metadata.json \
            --output "type=image,name=${IMAGE_NAME},push-by-digest=true,name-canonical=true,push=true" \
            -f distribution/app/Dockerfile .

      - name: Export digest
        run: |
          digest=$(jq -r '."containerimage.digest"' /tmp/metadata.json)
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-app-${{ env.PLATFORM_SLUG }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-app-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create -t ${IMAGE_NAME}:${{ inputs.tag }} \
            $(printf "${IMAGE_NAME}@sha256:%s " *)

      - name: Verify published manifest
        run: docker buildx imagetools inspect ${IMAGE_NAME}:${{ inputs.tag }}
