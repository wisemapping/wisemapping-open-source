name: Docker API Publish

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

env:
  IMAGE_NAME: registry.digitalocean.com/wise-registry/wisemapping/wisemapping-api

jobs:
  # The API image only unpacks Alpine packages and copies an
  # architecture-neutral JAR, so cross-building both platforms in a single job
  # under QEMU is cheap. No native arm64 runner is needed here.
  docker-api-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: jar-artifact
          path: wise-api/target/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: doctl
          password: ${{ secrets.DOCR_ACCESS_TOKEN }}

      # A multi-platform build cannot be loaded into the local daemon, so it is
      # tagged with the registry name and pushed directly instead of being
      # built, re-tagged and pushed in three separate steps.
      - name: Build and push multi-arch image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg ENABLE_NEWRELIC=true \
            -t ${IMAGE_NAME}:${{ inputs.tag }} \
            --push \
            -f distribution/api/Dockerfile .

      - name: Verify published manifest
        run: docker buildx imagetools inspect ${IMAGE_NAME}:${{ inputs.tag }}
